name: Deploy to GitHub Pages

# Собираем SPA и публикуем на GitHub Pages при пуше в master (и вручную).
on:
  push:
    branches: [master]
  workflow_dispatch:

# Права для официального деплоя на Pages через OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Не даём параллельным деплоям затирать друг друга; лишние прогоны отменяем.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # base подхватывается из GITHUB_REPOSITORY автоматически (см. vite.config.ts).
      # Ключи Supabase — из секретов репозитория; anon-ключ публичный (защита — RLS).
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
