<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Рецепты</title>
    <script>
      // GitHub Pages не умеет SPA: любой глубокий URL (/<repo>/r/123) отдаёт этот
      // 404. Кодируем путь в query и уходим на index — там его развернём обратно.
      // Техника spa-github-pages (github.com/rafgraph/spa-github-pages).
      // pathSegmentsToKeep = 1 — оставляем имя репозитория (префикс Pages).
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
